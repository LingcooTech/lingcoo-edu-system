services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fd_edu
      POSTGRES_USER: fd_edu
      POSTGRES_PASSWORD: fd_edu
    ports:
      - '5434:5432'
    volumes:
      - fd_edu_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    volumes:
      - fd_edu_redis_data:/data

volumes:
  fd_edu_postgres_data:
  fd_edu_redis_data:
