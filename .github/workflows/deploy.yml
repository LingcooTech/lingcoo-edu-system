name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: fd-edu-system
  GHCR_IMAGE: ghcr.io/futuredecade/fd-edu-system

jobs:
  build-and-push-acr:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare image variables
        id: vars
        shell: bash
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          ACR_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "acr_image=${ACR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push runtime image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.image_tag }}
            VITE_API_BASE_URL=
            VITE_TENANT_SLUG=meizhi
          tags: |
            ${{ steps.vars.outputs.acr_image }}:latest
            ${{ steps.vars.outputs.acr_image }}:${{ steps.vars.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.image_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  publish-ghcr:
    needs:
      - build-and-push-acr
    if: ${{ needs.build-and-push-acr.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Mirror ACR image to GHCR
        run: |
          : "${ACR_IMAGE:?ACR_IMAGE is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${IMAGE_TAG}" \
            "${ACR_IMAGE}:${IMAGE_TAG}"
        env:
          ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push-acr.outputs.image_tag }}

  deploy:
    needs:
      - build-and-push-acr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          DEPLOY_COMPOSE_FILE: docker-compose.prod.yml
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FD_EDU_IMAGE_NAME: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push-acr.outputs.image_tag }}
        run: |
          escape() {
            printf '%q' "$1"
          }

          remote_cmd="ACR_PASSWORD=$(escape "${ACR_PASSWORD}") \
             ACR_REGISTRY=$(escape "${ACR_REGISTRY}") \
             ACR_USERNAME=$(escape "${ACR_USERNAME}") \
             DEPLOY_COMPOSE_FILE=$(escape "${DEPLOY_COMPOSE_FILE}") \
             DEPLOY_HEALTHCHECK_URL=$(escape "${DEPLOY_HEALTHCHECK_URL}") \
             DEPLOY_PATH=$(escape "${DEPLOY_PATH}") \
             FD_EDU_IMAGE_NAME=$(escape "${FD_EDU_IMAGE_NAME}") \
             IMAGE_TAG=$(escape "${IMAGE_TAG}") \
             sh -s"

          # Keep the control connection alive and fail fast on a dead host so a
          # transient drop surfaces as exit 255 rather than hanging.
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # deploy.sh is idempotent (git reset --hard + image pull by digest +
          # migrate + health-check), so it is safe to re-run after a dropped SSH
          # session. Retry ONLY on exit 255 (SSH transport failure: connection
          # closed before/at handshake or mid-session). Any other code is the
          # remote script's own exit status and must surface immediately.
          attempt=1
          max_attempts=8
          while true; do
            set +e
            ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "${remote_cmd}" < ./scripts/deploy/deploy.sh
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 255 ]; then
              echo "deploy.sh exited with ${code} (not an SSH transport error) — not retrying"
              exit "$code"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH transport failed (255) after ${attempt} attempts — giving up"
              exit 255
            fi
            wait_s=$((attempt * 20))
            if [ "$wait_s" -gt 120 ]; then
              wait_s=120
            fi
            echo "SSH transport drop (255), attempt ${attempt}/${max_attempts} — retrying in ${wait_s}s"
            sleep "${wait_s}"
            attempt=$((attempt + 1))
          done
